[project]
name = "qri"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.139.2",
    "huggingface>=0.0.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-docling>=2.0.0",
    "langchain-groq>=1.1.3",
    "langchain-pinecone>=0.2.13",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.1",
    "langsmith>=0.3.14",
    "numexpr>=2.14.2",
    "pydantic>=2.13.4",
    "psycopg[binary]>=3.3.4",
    "psycopg-pool>=3.3.1",
    "sentence-transformers>=5.6.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.1",
    "opencv-python-headless>=5.0.0.93",
    "langchain-huggingface>=1.2.2",
    "langchain-core>=1.5.0",
    "langchain-ollama>=1.1.0",
    "pypdf>=6.16.1",
    "langfuse>=4.14.4",
    "opentelemetry-distro>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "python-dotenv>=1.2.2",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-instrumentation-logging>=0.65b0",
    "opentelemetry-instrumentation-requests>=0.65b0",
    "opentelemetry-instrumentation-httpx>=0.65b0",
    "opentelemetry-instrumentation-system-metrics>=0.65b0",
    "opentelemetry-instrumentation-asyncio>=0.65b0",
    "tesserocr>=2.11.0",
    "rapidocr-onnxruntime>=1.4.4",
    "onnxruntime>=1.29.0",
]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
start = "main:start"
dev = "main:dev"
