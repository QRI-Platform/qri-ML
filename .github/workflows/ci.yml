name: CI Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ vars.GROQ_API_KEY }}
      PINECONE_API_KEY: ${{ vars.PINECONE_API_KEY }}
      POSTGRES_SQL_URL: ${{ vars.POSTGRES_SQL_URL }}
      HF_TOKEN: ${{ vars.HF_TOKEN }}
      LANGFUSE_SECRET_KEY: ${{ vars.LANGFUSE_SECRET_KEY }}
      LANGFUSE_PUBLIC_KEY: ${{ vars.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
      LANGFUSE_HOST: ${{ vars.LANGFUSE_HOST }}
      OTEL_TELEMETRY_ENABLED: ${{ vars.OTEL_TELEMETRY_ENABLED }}
      OTEL_SERVICE_NAME: ${{ vars.OTEL_SERVICE_NAME }}
      OTEL_SERVICE_VERSION: ${{ vars.OTEL_SERVICE_VERSION }}
      OTEL_RESOURCE_ATTRIBUTES: ${{ vars.OTEL_RESOURCE_ATTRIBUTES }}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ vars.OTEL_EXPORTER_OTLP_HEADERS }}
      OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED: ${{ vars.OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Run tests
        run: uv run pytest -v -n=8

  build:
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${DOCKER_PASSWORD}" | docker login -u "${DOCKER_USERNAME}" --password-stdin

      - name: Build the Docker image
        run: docker build -t "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:latest" .

      - name: Push to Docker Hub
        run: docker push "${DOCKER_USERNAME}/${DOCKER_IMAGE_NAME}:latest"
